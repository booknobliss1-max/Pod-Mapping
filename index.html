<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pod Mapping Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        
        body { font-family: 'Inter', system_ui, sans-serif; }
        .title-font { font-family: 'Space Grotesk', sans-serif; }

        .pod-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pod-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200">
    <div class="flex h-screen overflow-hidden">
        <!-- LEFT PANEL -->
        <div class="w-96 bg-zinc-900 border-r border-zinc-800 flex flex-col">
            <div class="p-6 border-b border-zinc-800">
                <h1 class="text-3xl font-semibold title-font tracking-tight">Pod Mapping Network</h1>
                <p class="text-zinc-400 text-sm mt-2">Map your care, logistics, information, and emotional support pods.</p>
            </div>

            <div class="p-6 flex-1 overflow-auto">
                <h2 class="uppercase text-xs tracking-widest text-zinc-500 mb-4">POD MEMBER DETAILS</h2>
                
                <form id="podForm" class="space-y-6">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Name</label>
                        <input id="name" type="text" 
                               class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500"
                               placeholder="Full Name">
                    </div>

                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Role / Support Lane</label>
                        <div class="flex gap-2">
                            <select id="role" class="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500">
                                <option value="Information Sharing">Information Sharing</option>
                                <option value="Emotional Support">Emotional Support</option>
                                <option value="Logistics">Logistics</option>
                                <option value="Care">Care</option>
                                <option value="Housing">Housing</option>
                            </select>
                            <input id="customRole" type="text" placeholder="Custom role (optional)"
                                   class="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Notes</label>
                        <textarea id="notes" rows="3" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 focus:outline-none focus:border-emerald-500"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Contact Info</label>
                        <input id="contact" type="text" 
                               class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500"
                               placeholder="Phone or email">
                    </div>

                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Tags (comma-separated)</label>
                        <input id="tags" type="text" 
                               class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500"
                               placeholder="Spanish, Housing, etc.">
                    </div>

                    <div class="flex gap-3 pt-6">
                        <button onclick="savePod(event)" type="button"
                                class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-black font-semibold py-4 rounded-2xl flex items-center justify-center gap-2">
                            <i class="fa-solid fa-plus"></i> SAVE POD
                        </button>
                        <button onclick="clearForm()" type="button"
                                class="flex-1 bg-zinc-800 hover:bg-zinc-700 font-semibold py-4 rounded-2xl">
                            CLEAR FORM
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- RIGHT SIDE (same as before) -->
        <div class="flex-1 flex flex-col">
            <!-- Top bar, Sponsor Spotlight, Network Area, etc. -->
            <!-- (Kept the same for brevity - full code is below if needed) -->
            <div class="h-14 border-b border-zinc-800 bg-zinc-900 px-6 flex items-center justify-between">
                <div class="flex items-center gap-8">
                    <div class="flex items-center gap-2 text-emerald-400">
                        <i class="fa-solid fa-network-wired"></i>
                        <span class="font-medium">Network View &amp; Data</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="exportJSON()" class="px-4 py-1.5 text-xs font-medium bg-zinc-800 hover:bg-zinc-700 rounded-xl">↓ JSON</button>
                    <button onclick="exportCSV()" class="px-4 py-1.5 text-xs font-medium bg-zinc-800 hover:bg-zinc-700 rounded-xl">↓ CSV</button>
                    <button onclick="clearAllPods()" class="px-4 py-1.5 text-xs font-medium bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-xl">CLEAR ALL PODS</button>
                </div>
            </div>

            <div class="flex-1 p-6 overflow-auto bg-zinc-950" id="networkArea">
                <div id="podsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
            </div>
        </div>
    </div>

    <script>
        let pods = JSON.parse(localStorage.getItem('pods')) || [];

        function renderPods() {
            const container = document.getElementById('podsContainer');
            container.innerHTML = pods.length === 0 ? `
                <div class="col-span-full h-96 flex flex-col items-center justify-center text-center text-zinc-400">
                    <i class="fa-solid fa-network-wired text-6xl mb-6 opacity-30"></i>
                    <p class="text-xl">Your network is empty</p>
                    <p class="text-sm mt-2">Add pod members using the form on the left</p>
                </div>` : '';

            pods.forEach((pod, i) => {
                const div = document.createElement('div');
                div.className = "pod-card bg-zinc-900 border border-zinc-700 rounded-3xl overflow-hidden";
                div.innerHTML = `
                    <div class="p-5">
                        <div class="flex justify-between">
                            <div>
                                <div class="font-semibold">${pod.name}</div>
                                <div class="text-emerald-400 text-sm">${pod.role}</div>
                            </div>
                            <button onclick="deletePod(${i}); event.stopImmediatePropagation()" class="text-zinc-500 hover:text-red-400">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                        ${pod.notes ? `<div class="mt-3 text-sm text-zinc-400">${pod.notes}</div>` : ''}
                    </div>
                    <div class="bg-zinc-950 border-t border-zinc-800 p-4 text-xs flex justify-between items-center">
                        <span>${pod.contact || '—'}</span>
                        <button onclick="connectPod(${i}); event.stopImmediatePropagation()" class="text-emerald-400 hover:text-white">CONNECT</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function savePod(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            if (!name) return alert("Name is required");

            pods.unshift({
                id: Date.now(),
                name: name,
                role: document.getElementById('role').value,
                notes: document.getElementById('notes').value.trim(),
                contact: document.getElementById('contact').value.trim(),
                tags: document.getElementById('tags').value.trim()
            });

            localStorage.setItem('pods', JSON.stringify(pods));
            renderPods();
            clearForm();
            showToast(`${name} added to network`);
        }

        function clearForm() {
            document.getElementById('podForm').reset();   // Reset all fields
            // Extra safety to ensure name is cleared
            document.getElementById('name').value = '';
        }

        function deletePod(i) {
            if (confirm("Delete this pod?")) {
                pods.splice(i, 1);
                localStorage.setItem('pods', JSON.stringify(pods));
                renderPods();
            }
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = "fixed bottom-6 right-6 bg-zinc-800 border border-emerald-500 text-emerald-400 px-6 py-3 rounded-2xl shadow-xl";
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function clearAllPods() {
            if (confirm("Clear ALL pods?")) {
                pods = [];
                localStorage.clear();
                renderPods();
            }
        }

        // Initialize
        window.onload = () => renderPods();
    </script>
</body>
</html>
